openapi: 3.0.3

info:
  title: Health Dashboard API
  description: |
    Public integration surface for the Health Dashboard.

    Fetches a user's health metrics from Google Health for a requested
    time window. The API returns time-windowed activity, heart-rate
    statistics, sleep sessions, daily health metrics, and a derived
    physiological stress score.

    Results include the requested time window, local calendar days
    covered by the window, and per-metric errors where applicable.
    Daily health metrics and stress scores are cached in Postgres.

    The API is protected by a shared API key in the X-API-Key header.
    External integrations do not require a dashboard login session.

    The dashboard's admin and Google OAuth endpoints are internal to
    the web UI and are not documented as external integration endpoints.
  version: "1.0.0"

servers:
  - url: /
    description: Same-origin API

tags:
  - name: Health Data
    description: Fetch health metrics for a requested time window
  - name: Ops
    description: Liveness and database health checks

components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Static shared secret configured using the server's API_KEY
        environment variable. Required for POST /api/health.

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        errors:
          type: object
          additionalProperties: true
      required:
        - error

    Stress:
      type: object
      description: |
        Heuristic physiological stress estimate from 0 to 100.
        Higher scores indicate more stress relative to the user's
        personal baseline. This is not a clinical measurement.
      properties:
        score:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: Null when a usable score cannot be calculated.
        category:
          type: string
          enum:
            - Low
            - Typical
            - Elevated
            - High
            - Insufficient history
            - Unavailable
            - No data
        days_of_baseline:
          type: integer
          nullable: true
          description: Number of historical days used for the baseline.

    SleepScore:
      type: object
      nullable: true
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
        category:
          type: string
          enum:
            - Excellent
            - Good
            - Fair
            - Poor

    SleepStages:
      type: object
      description: Minutes spent in each sleep stage, keyed by stage name.
      additionalProperties:
        type: integer
      example:
        DEEP: 81
        LIGHT: 216
        REM: 121
        AWAKE: 6

    SleepSession:
      type: object
      description: A sleep session whose end time falls within the requested window.
      properties:
        start_time:
          type: string
          format: date-time
          nullable: true
          description: Sleep session start timestamp.
        end_time:
          type: string
          format: date-time
          nullable: true
          description: Sleep session end timestamp.
        type:
          type: string
          nullable: true
          description: Google Health sleep session type.
        main:
          type: boolean
          description: Whether this is the main sleep session.
        minutes_asleep:
          type: integer
          nullable: true
        minutes_awake:
          type: integer
          nullable: true
        minutes_in_bed:
          type: integer
          nullable: true
        stages:
          $ref: '#/components/schemas/SleepStages'
        sleep_score:
          $ref: '#/components/schemas/SleepScore'

    HeartRate:
      type: object
      description: Heart-rate statistics calculated from samples in the requested window.
      properties:
        avg:
          type: integer
          nullable: true
          description: Rounded average heart rate in beats per minute.
        min:
          type: integer
          nullable: true
          description: Minimum heart rate in beats per minute.
        max:
          type: integer
          nullable: true
          description: Maximum heart rate in beats per minute.
        samples:
          type: integer
          description: Number of valid heart-rate samples.

    Windowed:
      type: object
      description: Time-driven metrics calculated for the requested time window.
      properties:
        steps:
          type: integer
          nullable: true
          description: Total steps during the requested window.
        distance_miles:
          type: number
          format: float
          nullable: true
          description: Total distance in miles during the requested window.
        swim_strokes:
          type: integer
          nullable: true
          description: Total swimming strokes during the requested window.
        heart_rate:
          allOf:
            - $ref: '#/components/schemas/HeartRate'
          nullable: true
        sleep:
          type: array
          description: Sleep sessions whose end times fall within the requested window.
          items:
            $ref: '#/components/schemas/SleepSession'

    DailyHealth:
      type: object
      description: Day-driven health metrics for one local calendar day.
      properties:
        date:
          type: string
          format: date
          description: Local calendar date associated with these metrics.
        resting_hr:
          type: number
          format: float
          nullable: true
          description: Daily resting heart rate in beats per minute.
        hrv:
          type: number
          format: float
          nullable: true
          description: Average heart rate variability (RMSSD), in milliseconds.
        breathing_rate:
          type: number
          format: float
          nullable: true
          description: Daily breathing rate in breaths per minute.
        spo2:
          type: number
          format: float
          nullable: true
          description: Average oxygen saturation percentage.
        skin_temp:
          type: number
          format: float
          nullable: true
          description: Nightly skin temperature in degrees Celsius as reported by Google Health.
        vo2max:
          type: number
          format: float
          nullable: true
          description: Estimated VO2 max in mL/kg/min.
        stress:
          $ref: '#/components/schemas/Stress'
        snapshot:
          type: string
          enum:
            - saved
            - skipped
            - failed
          description: |
            Status of saving the daily health metrics to Postgres.
            saved means the snapshot was stored; skipped means there
            was no non-null data to store; failed means the database
            write failed.

    Window:
      type: object
      description: Normalized time window and the local days it covers.
      properties:
        start_utc:
          type: string
          format: date-time
          description: Start timestamp normalized to UTC.
          example: "2026-10-13T05:00:00Z"
        end_utc:
          type: string
          format: date-time
          description: End timestamp normalized to UTC.
          example: "2026-10-14T04:59:59Z"
        timezone:
          type: string
          description: Timezone used to determine the local calendar days.
          example: America/Chicago
        days:
          type: array
          description: Local calendar dates touched by the requested window.
          items:
            type: string
            format: date
          example:
            - "2026-10-13"

    HealthDataResponse:
      type: object
      required:
        - user_email
        - start_time
        - end_time
        - window
        - windowed
        - daily
        - errors
      properties:
        user_email:
          type: string
          format: email
          description: Email address identifying the registered Google Health user.
        start_time:
          description: Original start_time value supplied in the request.
          oneOf:
            - type: string
              format: date-time
            - type: integer
            - type: number
          example: "2026-10-13T00:00:00-05:00"
        end_time:
          description: Original end_time value supplied in the request.
          oneOf:
            - type: string
              format: date-time
            - type: integer
            - type: number
          example: "2026-10-13T23:59:59-05:00"
        window:
          $ref: '#/components/schemas/Window'
        windowed:
          $ref: '#/components/schemas/Windowed'
        daily:
          type: array
          description: Daily health metrics and stress scores for each local day covered by the window.
          items:
            $ref: '#/components/schemas/DailyHealth'
        errors:
          type: object
          description: |
            Per-metric errors. An empty object indicates that no individual
            metric errors were reported. A failed metric may have a null
            value in the corresponding result.
          additionalProperties:
            type: string
          example: {}

paths:
  /api/health:
    post:
      tags:
        - Health Data
      summary: Fetch health metrics for a time window
      operationId: fetchHealthData
      description: |
        Fetches health metrics for a registered user identified by email.

        Time-driven metrics, including steps, distance, swimming strokes,
        heart-rate statistics, and sleep sessions, are computed for the
        requested time window.

        Day-driven metrics, including resting heart rate, HRV, breathing
        rate, SpO2, skin temperature, VO2 max, and the derived stress score,
        are returned for every local calendar day touched by the window.

        The start_time and end_time values accept ISO 8601 timestamps or
        Unix timestamps in seconds or milliseconds. Naive ISO 8601 timestamps
        are interpreted in the server's DEFAULT_TIMEZONE.

        The effective window is start-inclusive and end-exclusive for metric
        queries. Input timestamps are truncated to whole seconds. The API
        requires a window of at least 60 seconds and no more than 31 days.

        Daily snapshots are merged into Postgres. Errors fetching individual
        metrics are reported in the errors object without necessarily failing
        the entire request.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_email
                - start_time
                - end_time
              properties:
                user_email:
                  type: string
                  format: email
                  description: Email address of a registered user linked to Google Health.
                  example: abc@gmail.com
                start_time:
                  description: |
                    Start of the requested window. Accepts an ISO 8601
                    timestamp, Unix timestamp in seconds, or Unix timestamp
                    in milliseconds.
                  oneOf:
                    - type: string
                      format: date-time
                    - type: integer
                    - type: number
                  example: "2026-10-13T00:00:00-05:00"
                end_time:
                  description: |
                    End of the requested window. Accepts an ISO 8601
                    timestamp, Unix timestamp in seconds, or Unix timestamp
                    in milliseconds. Must be after start_time.
                  oneOf:
                    - type: string
                      format: date-time
                    - type: integer
                    - type: number
                  example: "2026-10-13T23:59:59-05:00"
            example:
              user_email: abc@gmail.com
              start_time: "2026-10-13T00:00:00-05:00"
              end_time: "2026-10-13T23:59:59-05:00"
      responses:
        "200":
          description: Health data returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDataResponse'
              example:
                user_email: abc@gmail.com
                start_time: "2026-10-13T00:00:00-05:00"
                end_time: "2026-10-13T23:59:59-05:00"
                window:
                  days:
                    - "2026-10-13"
                  end_utc: "2026-10-14T04:59:59Z"
                  start_utc: "2026-10-13T05:00:00Z"
                  timezone: America/Chicago
                windowed:
                  distance_miles: 4.5
                  heart_rate:
                    avg: 65
                    max: 189
                    min: 40
                    samples: 38069
                  sleep:
                    - end_time: "2026-10-13T12:20:00Z"
                      main: true
                      minutes_asleep: 418
                      minutes_awake: 6
                      minutes_in_bed: 424
                      sleep_score:
                        category: Good
                        score: 87
                      stages:
                        AWAKE: 6
                        DEEP: 81
                        LIGHT: 216
                        REM: 121
                      start_time: "2026-10-13T05:16:00Z"
                      type: STAGES
                  steps: 9958
                  swim_strokes: 631
                daily:
                  - breathing_rate: 16.2
                    date: "2026-10-13"
                    hrv: 103.6
                    resting_hr: 51.0
                    skin_temp: 32.818764845605656
                    snapshot: saved
                    spo2: 95.8
                    stress:
                      category: Typical
                      days_of_baseline: 14
                      score: 51
                    vo2max: null
                errors: {}

        "400":
          description: Invalid request body, timestamps, or time window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidBody:
                  summary: Request body is not a JSON object
                  value:
                    error: Request body must be a JSON object
                missingEmail:
                  summary: Missing user email
                  value:
                    error: "'user_email' is required"
                missingTimes:
                  summary: Missing timestamps
                  value:
                    error: "'start_time' and 'end_time' are required"
                invalidTimestamp:
                  summary: Invalid timestamp format
                  value:
                    error: "Invalid 'start_time'/'end_time' — use a Unix timestamp or ISO 8601 string"
                invalidOrder:
                  summary: End time is not after start time
                  value:
                    error: "'end_time' must be after 'start_time'"
                windowTooSmall:
                  summary: Window is shorter than 60 seconds
                  value:
                    error: Window too small — minimum is 60 seconds
                windowTooLarge:
                  summary: Window exceeds 31 days
                  value:
                    error: Window too large — max 31 days per request. Split into smaller requests.

        "401":
          description: Invalid API key or the user is not authenticated with Google.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unauthorized:
                  summary: Missing or invalid API key
                  value:
                    error: Unauthorized
                notAuthenticated:
                  summary: Google authentication is missing or expired
                  value:
                    error: Not authenticated. Please sign in first.

        "404":
          description: No registered user found for the supplied email address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: No user found for that email

        "500":
          description: Server configuration, database, or unexpected internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                apiKeyNotConfigured:
                  summary: API key is not configured
                  value:
                    error: "Server misconfigured: API_KEY is not set"
                internalError:
                  summary: Health data fetch failed
                  value:
                    error: Failed to fetch health data

        "502":
          description: All metric fetch operations failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Failed to fetch health data
                errors:
                  steps: Google Health API error 503
                  distance: Google Health API error 503

  /health:
    get:
      tags:
        - Ops
      summary: Liveness and database health check
      operationId: healthCheck
      description: |
        Verifies that the application can connect to Postgres.
        This endpoint is separate from POST /api/health, which returns
        a user's health metrics.
      responses:
        "200":
          description: Application and database are healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
              example:
                status: ok
        "503":
          description: Database is unreachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - degraded
                  database:
                    type: string
                    enum:
                      - unreachable
                required:
                  - status
                  - database
              example:
                status: degraded
                database: unreachable