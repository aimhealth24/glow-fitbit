<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign in — Health Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:      #f7f8fa;
    --surface: #ffffff;
    --border:  #e4e7ec;
    --border2: #d0d5dd;
    --text:    #101828;
    --muted:   #667085;
    --blue:    #1570ef;
    --red:     #d92d20;
    --red-bg:  #fff1f0;
    --radius:  8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    width: 100%;
    max-width: 340px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
  }
  .brand-icon {
    width: 28px; height: 28px;
    background: var(--blue);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
  }
  .brand-name { font-weight: 600; font-size: 15px; }
  .brand-name span { color: var(--muted); font-weight: 400; }
  label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  input[type="password"] {
    width: 100%;
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 9px 12px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    outline: none;
    margin-bottom: 16px;
  }
  input[type="password"]:focus { border-color: var(--blue); }
  button {
    width: 100%;
    padding: 9px 12px;
    border-radius: var(--radius);
    border: 1px solid var(--blue);
    background: var(--blue);
    color: white;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  button:hover { background: #1462d4; }
  .error {
    background: var(--red-bg);
    color: var(--red);
    border-radius: var(--radius);
    padding: 8px 12px;
    font-size: 13px;
    margin-bottom: 16px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
      </div>
      <div class="brand-name">Health <span>Dashboard</span></div>
    </div>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autofocus required/>
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
